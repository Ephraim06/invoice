            <div class="modal-actions">
              <button onclick="closeUniversalSheet()" class="px-4 py-3 rounded-xl font-bold text-sm bg-[var(--bg-system)]">Cancel</button>
              <button onclick="window.commitFormCompanyNodeSaveWorkflow()" class="bg-ios-blue text-white font-extrabold px-5 py-3 rounded-xl shadow-lg text-sm">Save business</button>
            </div>
          </div>
        `;
        window.openUniversalSheet(titleLabel, sheetHtml);
        // If there's a logo, show it
        if (dataRecord?.logo) {
          const preview = document.getElementById('logoPreview');
          if (preview) preview.src = dataRecord.logo;
        }
      };

      // Logo upload handler
      window.handleLogoUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          showFormError('Please choose an image file.');
          event.target.value = '';
          return;
        }
        if (file.size > 10 * 1024 * 1024) {
          showFormError('That logo is too large. Please choose an image smaller than 10 MB.');
          event.target.value = '';
          return;
        }

        const imageUrl = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          const maxDimension = 512;
          const scale = Math.min(1, maxDimension / Math.max(image.width, image.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(image.width * scale));
          canvas.height = Math.max(1, Math.round(image.height * scale));
          canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/webp', 0.82);
          URL.revokeObjectURL(imageUrl);

          if (dataUrl.length > 700000) {
            showFormError('That logo is still too large after resizing. Please choose a simpler image.');
            return;
          }
          const preview = document.getElementById('logoPreview');
          if (preview) {
            preview.src = dataUrl;
            preview.style.display = 'block';
          }
          const logoInput = document.getElementById('form_compLogo');
          if (logoInput) logoInput.value = dataUrl;
          showToast('Logo ready');
        };
        image.onerror = () => {
          URL.revokeObjectURL(imageUrl);
          showFormError('We could not read that image. Please choose a different one.');
        };
        image.src = imageUrl;
        event.target.value = '';
      };

      window.clearLogo = () => {
        const preview = document.getElementById('logoPreview');
        if (preview) {
          preview.src = '';
          preview.style.display = 'none';
        }
        const logoInput = document.getElementById('form_compLogo');
        if (logoInput) logoInput.value = '';
        const fileInput = document.getElementById('logoFileInput');
        if (fileInput) fileInput.value = '';
      };

      window.commitFormCompanyNodeSaveWorkflow = () => {
        const nameVal = document.getElementById('form_compName')?.value?.trim();
        if (!nameVal) return showFormError('Please enter your business name.', 'form_compName');

        const targetedConfigId = state.editingTargetId;
        const structuralCorporatePayload = {
          id: targetedConfigId || createUniqueId('business'),
          name: nameVal,
          email: document.getElementById('form_compEmail')?.value?.trim() || '',
          address: document.getElementById('form_compAddr')?.value?.trim() || '',
          phone: document.getElementById('form_compPhone')?.value?.trim() || '',
          logo: document.getElementById('form_compLogo')?.value?.trim() || '',
          accountName: document.getElementById('form_compAccName')?.value?.trim() || '',
          bank: document.getElementById('form_compBank')?.value?.trim() || '',
          accNum: document.getElementById('form_compAcc')?.value?.trim() || '',
          accountType: document.getElementById('form_compAccType')?.value?.trim() || '',
          branchCode: document.getElementById('form_compBranch')?.value?.trim() || '',
          swiftCode: document.getElementById('form_compSwift')?.value?.trim() || '',
          paymentReference: document.getElementById('form_compPaymentRef')?.value?.trim() || '',
          defaultTerms: document.getElementById('form_compTerms')?.value?.trim() || '',
          accentColor: normalizeAccentColor(document.getElementById('form_compAccent')?.value)
        };

        let nextCompanies = [...state.companies];
        let nextActiveCompanyId = state.activeCompanyId;
        if (targetedConfigId) {
          const matchingIdx = state.companies.findIndex(c => c.id === targetedConfigId);
          if (matchingIdx > -1) nextCompanies[matchingIdx] = structuralCorporatePayload;
        } else {
          nextCompanies.push(structuralCorporatePayload);
          if (!nextActiveCompanyId) nextActiveCompanyId = structuralCorporatePayload.id;
        }

        if (!persistStateSnapshot(nextCompanies, state.documents, nextActiveCompanyId)) return;
        state.companies = nextCompanies;
        state.activeCompanyId = nextActiveCompanyId;
        syncDropdownSelectors();
        closeUniversalSheet();
        switchView('companies');
        showToast(targetedConfigId ? 'Business details updated' : 'Business added');
      };

      window.purgeCompanyNodeEngine = (id) => {
        const company = state.companies.find(c => c.id === id);
        if (!company) return;
        askForConfirmation('Delete this business?', `This will permanently delete ${company.name} and all of its invoices and quotes.`, 'Delete business', () => {
          const nextCompanies = state.companies.filter(c => c.id !== id);
          const nextDocuments = state.documents.filter(d => d.companyId !== id);
          const nextActiveCompanyId = state.activeCompanyId === id
            ? nextCompanies[0]?.id || null
            : state.activeCompanyId;
          if (!persistStateSnapshot(nextCompanies, nextDocuments, nextActiveCompanyId)) return;
          state.companies = nextCompanies;
          state.documents = nextDocuments;
          state.activeCompanyId = nextActiveCompanyId;
          syncDropdownSelectors();
          switchView('companies');
          showToast('Business deleted');
        });
      };

      // =========================================================================
      // FLAWLESS SYSTEM INTEGRATED INTERFACE LIGHT/DARK ENVIRONMENT SWITCH MATRICES
      // =========================================================================
      window.masterThemeToggler = () => {
        const rootElement = document.documentElement;
        const activeDarkStatusFlag = rootElement.classList.contains('dark');

        const nextStateThemeString = activeDarkStatusFlag ? 'light' : 'dark';

        rootElement.classList.toggle('dark', !activeDarkStatusFlag);
        rootElement.classList.toggle('light', activeDarkStatusFlag);

        try {
          localStorage.setItem('bf_premium_theme_state_v2', nextStateThemeString);
        } catch (error) {
          showStorageProblem(error);
        }
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', nextStateThemeString === 'dark' ? '#000000' : '#f5f5f7');
        }
      };

      // =========================================================================
      // COLD INITIALIZATION LIFECYCLE BOOT LOOPS
      // =========================================================================
      (function bootSequenceSystemLoop() {
        // Evaluate systemic local environmental theme parameters safely
        let savedCacheEnvironmentTheme = 'light';
        try {
          savedCacheEnvironmentTheme = localStorage.getItem('bf_premium_theme_state_v2') || 'light';
        } catch (error) {
          storageReadWarning = 'This browser is blocking local storage. Your changes may not be kept after you close the app.';
          console.error('Could not read the saved theme:', error);
        }
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(savedCacheEnvironmentTheme);
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', savedCacheEnvironmentTheme === 'dark' ? '#000000' : '#f5f5f7');
        }

        // Build view state environments dynamically
        syncDropdownSelectors();
        switchView('dashboard');
        if (storageReadWarning) setTimeout(() => showToast(storageReadWarning), 200);
      })();

    })();
  </script>
</body>

<script>
  // PWA Installation Prompt
  let deferredPrompt;

  // Listen for the beforeinstallprompt event
  window.addEventListener('beforeinstallprompt', (e) => {
    // Prevent Chrome 76+ from automatically showing the prompt
    e.preventDefault();
    // Stash the event so it can be triggered later
    deferredPrompt = e;
    
    // Show the install button or prompt
    showInstallPrompt();
  });

  // Function to show the install prompt
  function showInstallPrompt() {
    // Check if the app is already installed
    if (window.matchMedia('(display-mode: standalone)').matches) {
      return; // Already installed
    }

    // Create a custom install banner
    const installBanner = document.createElement('div');
    installBanner.id = 'installBanner';
    installBanner.style.cssText = `
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 400px;
      width: 90%;
      background: var(--bg-card);
      border: 1px solid var(--border-system);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    `;

    installBanner.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;">
        <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0071e3,#af52de);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:20px;flex-shrink:0;">B</div>
        <div style="min-width:0;">
          <div style="font-weight:600;font-size:14px;color:var(--text-primary);">Install BizFlow</div>
          <div style="font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Get the full app experience</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <button onclick="dismissInstallPrompt()" style="padding:8px 12px;border:none;background:transparent;color:var(--text-secondary);font-weight:600;font-size:13px;cursor:pointer;border-radius:8px;">Later</button>
        <button id="installBtn" style="padding:8px 16px;border:none;background:#0071e3;color:white;font-weight:600;font-size:13px;border-radius:10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,113,227,0.3);">Install</button>
      </div>
    `;

    document.body.appendChild(installBanner);

    // Add click handler for install button
    document.getElementById('installBtn').addEventListener('click', async () => {
      if (deferredPrompt) {
        // Show the install prompt
        deferredPrompt.prompt();
        // Wait for the user to respond to the prompt
        const choiceResult = await deferredPrompt.userChoice;
        if (choiceResult.outcome === 'accepted') {
          console.log('User accepted the install prompt');
          dismissInstallPrompt();
        } else {
          console.log('User dismissed the install prompt');
        }
        deferredPrompt = null;
      }
    });

    // Add animation keyframes
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }
    `;
    document.head.appendChild(style);
  }

  // Function to dismiss the install banner
  window.dismissInstallPrompt = function() {
    const banner = document.getElementById('installBanner');
    if (banner) {
      banner.style.opacity = '0';
      banner.style.transform = 'translateX(-50%) translateY(20px)';
      setTimeout(() => banner.remove(), 400);
    }
  };

  // Handle successful installation
  window.addEventListener('appinstalled', (evt) => {
    console.log('BizFlow was installed successfully!');
    dismissInstallPrompt();
  });

  // Check if app is already in standalone mode on load
  if (window.matchMedia('(display-mode: standalone)').matches) {
    console.log('App is already installed and running in standalone mode');
  }
</script>

</html>
